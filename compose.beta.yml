# Compose >= 2.30 (raw env files). No local-development databases are reused.
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable release image}
    restart: unless-stopped
    env_file:
      - path: ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE}
        format: raw
    environment:
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "${CADDY_IP:-172.30.90.2}"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        ipv4_address: ${APP_IP:-172.30.90.3}
      datastore: {}
      observe: {}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [datastore]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    env_file:
      - path: ${PROXY_ENV_FILE:?Set PROXY_ENV_FILE}
        format: raw
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${PRODUCT_IMAGE_DIR:-product_images}:/srv/product-images:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        ipv4_address: ${CADDY_IP:-172.30.90.2}
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
  # 관측: 호스트 포트 없음. 메트릭·로그는 Alloy가 모니터링 서버로 push
  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observe]
    logging: *logging
  alloy:
    image: grafana/alloy:v1.8.3@sha256:ab04df3936e4d71d31b6f55e0c58a7e749091f59635dd8c2bc731ba1b6c93701
    restart: unless-stopped
    env_file:
      - path: ${OBSERVE_ENV_FILE:?Set OBSERVE_ENV_FILE}
        format: raw
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-4evr0-beta}
    # 이미지 기본 경로(/var/lib/alloy, alloy:0770)는 cap_drop 상태의 root가 못 들어가서 별도 경로 사용
    command: [run, /etc/alloy/config.alloy, --storage.path=/alloy-data]
    volumes:
      - ./deploy/alloy-beta.alloy:/etc/alloy/config.alloy:ro
      # 로그 수집용(컨테이너 목록·stdout 조회)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # WAL·로그 읽은 위치 보존(재시작 시 중복·유실 방지)
      - alloy_data:/alloy-data
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observe]
    logging: *logging
networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.90.0/28}
  datastore:
    internal: true
  # 외부 송신 필요(Tailscale 경유 모니터링 서버)라 internal 아님
  observe: {}
volumes:
  product_images:
  redis_data:
  caddy_data:
  caddy_config:
  alloy_data:
