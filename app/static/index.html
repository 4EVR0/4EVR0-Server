<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4EVR0 · 화장품 성분 추천</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg: #f7faf2;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-strong: #ffffff;
    --line: rgba(60, 80, 34, 0.14);
    --text: #182010;
    --muted: #6b765e;
    --soft: #3f4b35;
    --brand: #9BCE26;
    --brand-2: #6BAA18;
    --brand-3: #EEF8D8;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(155, 206, 38, 0.20), transparent 32%),
      radial-gradient(circle at 82% 16%, rgba(229, 245, 183, 0.55), transparent 30%),
      linear-gradient(135deg, #ffffff 0%, #f7faf2 52%, #eef6df 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.38;
    background-image:
      linear-gradient(rgba(107, 170, 24, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(107, 170, 24, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at center, black, transparent 76%);
  }

  .app-shell {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: 20px;
    gap: 18px;
  }

  header {
    min-height: 68px;
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 14px 16px 14px 20px;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(22px);
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 18px 60px rgba(60, 80, 34, 0.10);
  }
  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #ffffff;
    overflow: hidden;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .logo { font-size: 19px; font-weight: 850; letter-spacing: -0.7px; }
  .sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .header-spacer { flex: 1; }

  #model-badge, .dashboard-link, .status-pill {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.78);
    color: var(--soft);
    font-size: 12px;
    text-decoration: none;
    border-radius: 999px;
    padding: 9px 12px;
  }
  .dashboard-link:hover { border-color: rgba(155, 206, 38, 0.7); color: #3f6212; }
  #model-badge { display: none; color: #5f8f13; }
  .status-pill { display: flex; align-items: center; gap: 8px; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    box-shadow: 0 0 16px rgba(251, 113, 133, 0.7);
    transition: background 0.3s, box-shadow 0.3s;
  }
  #status-dot.ok { background: var(--brand); box-shadow: 0 0 16px rgba(155, 206, 38, 0.75); }

  .main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(320px, 0.88fr) minmax(520px, 1.12fr);
    gap: 18px;
  }

  .hero, .chat-panel {
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 30px;
    background: var(--panel);
    backdrop-filter: blur(24px);
    box-shadow: 0 22px 70px rgba(60, 80, 34, 0.12);
    overflow: hidden;
  }

  .hero {
    position: relative;
    padding: 34px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hero::after {
    content: "";
    position: absolute;
    width: 360px; height: 360px;
    right: -130px; bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(155,206,38,0.34), rgba(238,248,216,0.55) 52%, transparent 68%);
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(155, 206, 38, 0.42);
    color: #4d7c0f;
    background: rgba(238, 248, 216, 0.82);
    font-size: 12px;
    font-weight: 700;
  }
  .hero h1 {
    margin-top: 24px;
    max-width: 560px;
    font-size: clamp(42px, 5.6vw, 76px);
    line-height: 0.93;
    letter-spacing: -4px;
  }
  .hero h1 span {
    color: transparent;
    background: linear-gradient(90deg, #182010, #6BAA18 50%, #9BCE26);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .hero-copy {
    margin-top: 22px;
    max-width: 520px;
    color: #56624b;
    font-size: 15px;
    line-height: 1.75;
  }


  .chat-panel { display: grid; grid-template-rows: auto 1fr auto; }
  .chat-head {
    padding: 22px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: rgba(249, 252, 242, 0.76);
  }
  .chat-head h2 { font-size: 18px; letter-spacing: -0.4px; }
  .chat-head p { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .sparkle { width: 42px; height: 42px; display:grid; place-items:center; border-radius: 16px; background: rgba(238, 248, 216, 0.92); border: 1px solid rgba(155,206,38,0.28); }

  #chat {
    min-height: 0;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 10px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(107, 170, 24, 0.22); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }

  .welcome-card {
    border: 1px solid rgba(155, 206, 38, 0.28);
    border-radius: 24px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(238,248,216,0.92), rgba(255,255,255,0.94));
  }
  .sys-msg { font-size: 13px; color: #56624b; line-height: 1.65; }
  .prompt-grid { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .prompt-chip {
    text-align: left;
    cursor: pointer;
    border: 1px solid rgba(60, 80, 34, 0.12);
    border-radius: 16px;
    padding: 13px 14px;
    background: #ffffff;
    color: #26311d;
    font: inherit;
    line-height: 1.45;
    transition: transform 0.18s, border-color 0.18s, background 0.18s;
  }
  .prompt-chip:hover { transform: translateY(-2px); border-color: rgba(155,206,38,0.7); background: #f7fceb; }

  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; flex-shrink: 0;
  }
  .avatar.user { background: linear-gradient(135deg, #9BCE26, #6BAA18); color: white; }
  .avatar.ai { background: #f3f8e8; color: #5f8f13; border: 1px solid var(--line); }

  .bubble {
    max-width: min(78%, 680px);
    padding: 14px 17px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.68;
    word-break: break-word;
  }
  .bubble.user { background: linear-gradient(135deg, #9BCE26, #6BAA18); color: white; border-radius: 20px 7px 20px 20px; box-shadow: 0 16px 36px rgba(107,170,24,0.18); }
  .bubble.ai { background: #ffffff; border: 1px solid var(--line); border-radius: 7px 20px 20px 20px; color: var(--text); box-shadow: 0 14px 34px rgba(60, 80, 34, 0.07); }
  .answer-kicker { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 9px; color: #5f8f13; font-size: 11px; font-weight: 800; letter-spacing: -0.1px; }
  .answer-kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
  .answer-body { color: #25301d; }
  .product-section { margin-top: 16px; }
  .product-card {
    cursor: pointer;
    border: 1px solid rgba(155, 206, 38, 0.34);
    border-radius: 22px;
    background: linear-gradient(135deg, #ffffff, #fbfdf6);
    overflow: hidden;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  }
  .product-card:hover { transform: translateY(-2px); border-color: rgba(155, 206, 38, 0.72); box-shadow: 0 18px 42px rgba(60, 80, 34, 0.12); }
  .product-card:focus { outline: none; box-shadow: 0 0 0 4px rgba(155,206,38,0.16); }
  .product-main { display: grid; grid-template-columns: 112px 1fr auto; gap: 16px; align-items: center; padding: 16px; }
  .product-image-slot {
    width: 112px;
    aspect-ratio: 1;
    border-radius: 18px;
    border: 1px dashed rgba(107, 170, 24, 0.42);
    background: radial-gradient(circle at 35% 25%, #ffffff, #eef8d8);
    display: grid;
    place-items: center;
    color: #6b765e;
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
  }
  .product-image-slot img { width: 100%; height: 100%; object-fit: cover; }
  .product-label { color: #5f8f13; font-size: 11px; font-weight: 850; margin-bottom: 5px; }
  .product-name { color: #182010; font-size: 18px; font-weight: 850; letter-spacing: -0.5px; }
  .product-desc { margin-top: 7px; color: #56624b; font-size: 13px; line-height: 1.55; }
  .product-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .product-meta span { padding: 5px 9px; border-radius: 999px; background: #f0f8dc; color: #4d7c0f; font-size: 11px; font-weight: 750; }
  .product-meta span.rating-pill { background: #fff3d6; color: #a9781a; }
  .product-meta span.review-pill { background: #eaf3ff; color: #2f6aa0; }
  .product-link { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 800; color: #4d7c0f; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(155,206,38,0.5); border-radius: 999px; transition: background 0.15s; }
  .product-link:hover { background: #f0f8dc; }
  .product-toggle { color: #6b765e; font-size: 20px; transition: transform 0.18s; }
  .product-card.open .product-toggle { transform: rotate(180deg); }
  .product-ingredients { display: none; border-top: 1px solid rgba(60, 80, 34, 0.10); padding: 14px 16px 16px; background: #ffffff; }
  .product-card.open .product-ingredients { display: block; }
  .product-rationale { margin-bottom: 14px; padding: 12px 14px; background: #f4faf3; border-left: 3px solid var(--green, #4caf72); border-radius: 8px; color: #3a4a33; font-size: 13px; line-height: 1.6; }
  .ingredients-heading { margin-bottom: 10px; color: #3f4b35; font-size: 12px; font-weight: 850; }
  .ingredients-grid { display: grid; gap: 8px; }
  .ingredient-row {
    display: grid;
    grid-template-columns: minmax(110px, 0.8fr) minmax(180px, 1.6fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 14px;
    background: #fbfdf7;
    border: 1px solid rgba(60, 80, 34, 0.10);
  }
  .ingredient-name { color: #5f8f13; font-size: 13px; font-weight: 850; }
  .ingredient-claim { color: #56624b; font-size: 12px; line-height: 1.45; }
  .tier { font-size: 10px; padding: 4px 9px; border-radius: 999px; font-weight: 800; white-space: nowrap; letter-spacing: 0.2px; }
  .tier-confirmed { background: rgba(20, 83, 45, 0.9); color: #bbf7d0; }
  .tier-promising { background: rgba(113, 63, 18, 0.9); color: #fde68a; }
  .tier-preliminary { background: rgba(30, 58, 95, 0.9); color: #bfdbfe; }
  .tier-insufficient { background: rgba(30, 30, 46, 0.9); color: #9ca3af; }

  .typing { display: flex; gap: 5px; align-items: center; padding: 7px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.24;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
  .bubble.error { background: rgba(69, 10, 10, 0.82); border-color: rgba(248, 113, 113, 0.38); color: #fecaca; }

  #input-area {
    padding: 18px;
    border-top: 1px solid var(--line);
    background: rgba(249, 252, 242, 0.78);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .composer-wrap {
    flex: 1;
    min-height: 52px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 20px;
    background: #ffffff;
    display: flex;
    align-items: flex-end;
    padding: 5px 6px 5px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer-wrap:focus-within { border-color: rgba(155, 206, 38, 0.75); box-shadow: 0 0 0 4px rgba(155,206,38,0.12); }
  #msg {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    padding: 11px 0;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 124px;
    line-height: 1.5;
  }
  #msg::placeholder { color: #64748b; }
  #msg:disabled { opacity: 0.45; }
  #send {
    background: linear-gradient(135deg, var(--brand-2), var(--brand));
    border: none;
    border-radius: 16px;
    width: 44px; height: 44px;
    cursor: pointer;
    color: white;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.18s, filter 0.18s, opacity 0.18s;
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
  #send:disabled { opacity: 0.42; cursor: default; }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .app-shell { height: auto; min-height: 100vh; }
    .main { grid-template-columns: 1fr; }
    .hero { min-height: 440px; }
    .chat-panel { min-height: 650px; }
  }

  @media (max-width: 620px) {
    .app-shell { padding: 10px; gap: 10px; }
    header { border-radius: 20px; flex-wrap: wrap; }
    .hero, .chat-panel { border-radius: 24px; }
    .hero { padding: 24px; }
    .hero h1 { letter-spacing: -2.3px; }
    .prompt-grid { grid-template-columns: 1fr; }
    .bubble { max-width: 86%; }
    .product-main { grid-template-columns: 86px 1fr auto; gap: 12px; padding: 13px; }
    .product-image-slot { width: 86px; border-radius: 15px; }
    .ingredient-row { grid-template-columns: 1fr; gap: 5px; }
    .dashboard-link, #model-badge, .status-pill { font-size: 11px; padding: 7px 9px; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header>
    <div class="brand-mark"><img src="/static/logo.png" alt="4EVR0"></div>
    <div>
      <div class="logo">4EVR0</div>
      <div class="sub">GraphRAG 기반 화장품 성분 추천 AI</div>
    </div>
    <div class="header-spacer"></div>
    <a class="dashboard-link" href="/iceberg">Iceberg 현황판</a>
    <div id="model-badge"></div>
    <div class="status-pill"><span id="status-dot" title="연결 중..."></span><span>Live API</span></div>
  </header>

  <main class="main">
    <section class="hero" aria-label="4EVR0 소개">
      <div>
        <h1>내 피부 고민에<br><span>딱 맞는 성분</span> 찾기</h1>
        <p class="hero-copy">
          올리브영을 둘러보듯 쉽고 가볍게 질문하세요. 4EVR0가 논문 클레임과 성분 그래프를 연결해 제품을 고르기 전 확인할 만한 핵심 성분을 정리해드립니다.
        </p>
      </div>
    </section>

    <section class="chat-panel" aria-label="성분 추천 채팅">
      <div class="chat-head">
        <div>
          <h2>Ingredient Concierge</h2>
          <p>피부 고민, 사용 중인 제품, 원하는 제형을 자연어로 적어보세요.</p>
        </div>
        <div class="sparkle">✨</div>
      </div>

      <div id="chat">
        <div class="welcome-card">
          <div class="sys-msg" id="sys-init">세션을 시작하는 중...</div>
          <div class="prompt-grid" aria-label="추천 질문 예시">
            <button class="prompt-chip" data-prompt="민감하고 건조한 피부인데 장벽 회복에 도움되는 성분을 추천해줘">민감·건조 피부 장벽 성분</button>
            <button class="prompt-chip" data-prompt="여드름 흔적과 붉은기가 고민인데 근거가 있는 성분을 알려줘">흔적·붉은기 케어 성분</button>
            <button class="prompt-chip" data-prompt="미백 기능성 성분 중 논문 근거가 강한 성분 위주로 비교해줘">미백 성분 근거 비교</button>
            <button class="prompt-chip" data-prompt="레티놀을 쓰고 싶은데 초보자가 같이 보면 좋은 성분 조합을 알려줘">레티놀 초보 조합</button>
          </div>
        </div>
      </div>

      <div id="input-area">
        <div class="composer-wrap">
          <textarea id="msg" placeholder="예: 속건조와 붉은기가 있는데 세라마이드 말고도 볼 성분이 있을까?" rows="1" disabled></textarea>
        </div>
        <button id="send" disabled>↑</button>
      </div>
    </section>
  </main>
</div>

<script>
  const chat    = document.getElementById('chat');
  const msgEl   = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const dot     = document.getElementById('status-dot');
  const badge   = document.getElementById('model-badge');

  let sessionId = null;
  let sending   = false;

  async function initSession() {
    try {
      const res  = await fetch('/api/v1/sessions', { method: 'POST' });
      const data = await res.json();
      sessionId  = data.session_id;

      dot.classList.add('ok');
      dot.title = '연결됨';
      document.getElementById('sys-init').textContent =
        '새 세션이 시작되었습니다. 아래 예시를 누르거나 피부 고민을 직접 입력해보세요.';

      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    } catch (e) {
      document.getElementById('sys-init').textContent =
        '서버에 연결할 수 없습니다. 페이지를 새로고침해주세요.';
    }
  }

  function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="avatar user">나</div>
      <div class="bubble user">${escHtml(text)}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // 응답을 "고민분석+성분설명"(intro)과 "추천 제품"(제품별 설명 원문)으로 분리.
  function splitResponse(text) {
    const lines = String(text || '').split('\n');
    const i = lines.findIndex(l => /^\s*#*\s*추천\s*제품/.test(l));
    if (i < 0) return { intro: String(text || ''), productSection: '' };
    return { intro: lines.slice(0, i).join('\n').trim(), productSection: lines.slice(i + 1).join('\n') };
  }

  // 추천 제품 원문에서 해당 제품 문장을 찾아 제품명 이후만 깔끔히 뽑는다.
  function productDescription(product, productSection) {
    if (!productSection || !product.product_name) return '';
    const name = product.product_name;
    for (const raw of productSection.split('\n')) {
      const line = raw.trim();
      if (!line || !line.includes(name)) continue;
      let d = line.replace(/^[-•*]\s*/, '').replace(/^\s*\[[^\]]*\]\s*/, '');
      const ni = d.indexOf(name);
      if (ni >= 0) d = d.slice(ni + name.length).replace(/^\s*[은는이가을를]\s*/, '').trim();
      return d;
    }
    return '';
  }

  function appendAIBubble(responseText, ingredients, products, modelUsed) {
    if (modelUsed) { badge.textContent = modelUsed; badge.style.display = 'inline-flex'; }
    const hasProducts = !!(products && products.length);
    const { intro, productSection } = splitResponse(responseText);
    const bodyText = hasProducts ? intro : String(responseText || '');

    const productCardsHtml = products && products.length
      ? `<div class="product-section">${products.map(product => `
          <div class="product-card" role="button" tabindex="0" aria-expanded="false">
            <div class="product-main">
              <div class="product-image-slot">
                ${productImageUrl(product)
                  ? `<img src="${escAttr(productImageUrl(product))}" alt="${escAttr(product.product_name)}">`
                  : '<span>제품 이미지</span>'}
              </div>
              <div class="product-info">
                <div class="product-label">${escHtml(product.brand)}</div>
                <div class="product-name">${escHtml(product.product_name)}</div>
                <div class="product-desc">추천 성분 ${escHtml(product.matched_count)}개가 매칭된 ${escHtml(product.category)} 제품입니다.</div>
                <div class="product-meta">
                  <span>${escHtml(product.category)}</span>
                  ${product.rating ? `<span class="rating-pill">⭐ ${escHtml(product.rating)} · 리뷰 ${escHtml(product.review_count || 0)}</span>` : ''}
                  ${reviewHighlight(product) ? `<span class="review-pill">${escHtml(reviewHighlight(product))}</span>` : ''}
                </div>
                ${product.product_url ? `<a class="product-link" href="${escAttr(product.product_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">올리브영에서 보기 →</a>` : ''}
              </div>
              <div class="product-toggle">⌄</div>
            </div>
            <div class="product-ingredients">
              ${productDescription(product, productSection) ? `<div class="product-rationale">${escHtml(productDescription(product, productSection))}</div>` : ''}
              <div class="ingredients-heading">이 화장품에 포함된 추천 성분</div>
              <div class="ingredients-grid">${(product.matched_ingredients || []).map(name => `
                <div class="ingredient-row">
                  <div class="ingredient-name">${ingredientNameByInci(name, ingredients)}</div>
                  <div class="ingredient-claim">${ingredientClaimByInci(name, ingredients)}</div>
                </div>`).join('')}</div>
            </div>
          </div>`).join('')}</div>`
      : '';

    const ingredientCardsHtml = !productCardsHtml && ingredients && ingredients.length
      ? `<div class="product-section">
          <div class="product-card" role="button" tabindex="0" aria-expanded="false">
            <div class="product-main">
              <div class="product-image-slot"><span>제품 이미지</span></div>
              <div class="product-info">
                <div class="product-label">추천 화장품</div>
                <div class="product-name">피부 고민 맞춤 추천 제품</div>
                <div class="product-desc">답변에서 제안한 핵심 성분이 포함된 제품을 이 영역에 연결해 보여줄 수 있습니다.</div>
                <div class="product-meta"><span>추천 성분 ${ingredients.length}개</span><span>클릭해서 전성분 보기</span></div>
              </div>
              <div class="product-toggle">⌄</div>
            </div>
            <div class="product-ingredients">
              <div class="ingredients-heading">이 화장품에 포함된 추천 성분</div>
              <div class="ingredients-grid">${ingredients.map(ing => `
                <div class="ingredient-row">
                  <div class="ingredient-name">${ingredientName(ing)}</div>
                  <div class="ingredient-claim" title="${escAttr(ing.claim || '')}">${claimKo(ing.claim)}</div>
                </div>`).join('')}</div>
            </div>
          </div>
        </div>`
      : '';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai">
        <div class="answer-kicker">4EVR0 추천 답변</div>
        <div class="answer-body">${escHtml(bodyText).replace(/\n/g, '<br>')}</div>
        ${productCardsHtml || ingredientCardsHtml}
      </div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble error">${escHtml(msg)}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  async function send() {
    if (sending || !sessionId) return;
    const text = msgEl.value.trim();
    if (!text) return;

    sending = true;
    msgEl.value   = '';
    msgEl.style.height = '';
    msgEl.disabled  = true;
    sendBtn.disabled = true;

    appendUserBubble(text);
    appendTyping();

    try {
      const res  = await fetch('/api/v1/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendError(`오류 (${res.status}): ${err.detail || '알 수 없는 오류'}`);
      } else {
        const data = await res.json();
        appendAIBubble(data.response_text, data.ingredients, data.products, data.model_used);
      }
    } catch (e) {
      removeTyping();
      appendError('서버와 통신 중 오류가 발생했습니다.');
    } finally {
      sending = false;
      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);

  chat.addEventListener('click', e => {
    const card = e.target.closest('.product-card');
    if (!card) return;
    card.classList.toggle('open');
    card.setAttribute('aria-expanded', card.classList.contains('open') ? 'true' : 'false');
  });

  chat.addEventListener('keydown', e => {
    const card = e.target.closest('.product-card');
    if (!card || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    card.click();
  });

  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 124) + 'px';
  });

  document.querySelectorAll('.prompt-chip').forEach(button => {
    button.addEventListener('click', () => {
      if (msgEl.disabled) return;
      msgEl.value = button.dataset.prompt;
      msgEl.dispatchEvent(new Event('input'));
      send();
    });
  });

  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escAttr(s) {
    return escHtml(s).replace(/'/g, '&#39;');
  }

  function ingredientName(ing) {
    if (ing.kor_name && ing.kor_name.trim() && ing.kor_name.trim().toLowerCase() !== String(ing.name).toLowerCase()) {
      return `${escHtml(ing.kor_name.trim())} (${escHtml(ing.name)})`;
    }
    return escHtml(ing.name);
  }

  function ingredientByInci(name, ingredients) {
    return (ingredients || []).find(ing => String(ing.name).toLowerCase() === String(name).toLowerCase());
  }

  function ingredientNameByInci(name, ingredients) {
    const ing = ingredientByInci(name, ingredients);
    return ing ? ingredientName(ing) : escHtml(name);
  }

  // 효능(effect) 영문 → 한글. 15개 effect. claim은 effect_name_en(예: "Barrier repair").
  const EFFECT_KO = {
    'anti-inflammatory': '항염', 'soothing': '진정', 'barrier repair': '장벽 강화',
    'hydrating': '수분 공급', 'moisture retention': '수분 유지', 'sebum regulation': '피지 조절',
    'antimicrobial': '항균', 'keratolytic': '각질 용해', 'comedolytic': '면포 용해',
    'wound healing': '상처 회복', 'depigmenting': '색소 억제', 'brightening': '미백/광채',
    'antioxidant': '항산화', 'photoprotective': '광보호', 'anti-aging': '노화 방지',
  };

  // "한글 (영문)" 형식. 매핑 없으면 영문만.
  function claimKo(claim) {
    if (!claim) return '매칭 성분';
    const ko = EFFECT_KO[String(claim).trim().toLowerCase()];
    return ko ? `${ko} (${escHtml(claim)})` : escHtml(claim);
  }

  function ingredientClaimByInci(name, ingredients) {
    const ing = ingredientByInci(name, ingredients);
    return ing && ing.claim ? claimKo(ing.claim) : '매칭 성분';
  }

  function ingredientTierByInci(name, ingredients) {
    const ing = ingredientByInci(name, ingredients);
    return ing && ing.eligibility_tier ? ing.eligibility_tier : 'Insufficient';
  }

  // 리뷰 통계에서 가장 두드러진 항목 한 개를 뽑아 pill로 표시(부연). 자극도 우선.
  function reviewHighlight(product) {
    const stats = product && product.review_stats;
    if (!stats) return '';
    for (const axis of ['자극도', '피부고민']) {
      const d = stats[axis];
      if (d && typeof d === 'object') {
        let best = '', bestPct = -1;
        for (const [k, v] of Object.entries(d)) {
          const pct = parseFloat(String(v).replace('%', '')) || 0;
          if (pct > bestPct) { bestPct = pct; best = k; }
        }
        if (best && bestPct > 0) return `${best} ${d[best]}`;
      }
    }
    return '';
  }

  function productImageUrl(product) {
    if (product && product.image_url) {
      return product.image_url;
    }
    const goodsNo = product && product.goods_no ? String(product.goods_no).trim() : '';
    if (goodsNo) {
      return `https://oliveyoung-crawl-data.s3.amazonaws.com/oliveyoung_images/goodsNo=${encodeURIComponent(goodsNo)}/main.jpg`;
    }
    return '';
  }

  function tierClass(tier) {
    const map = {
      Confirmed: 'tier-confirmed',
      Promising: 'tier-promising',
      Preliminary: 'tier-preliminary',
      Insufficient: 'tier-insufficient',
    };
    return map[tier] || 'tier-insufficient';
  }

  initSession();
</script>
</body>
</html>
