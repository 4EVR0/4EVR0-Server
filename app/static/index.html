<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4EVR0 · 화장품 성분 추천</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; color: #60a5fa; letter-spacing: -0.5px; }
  .sub  { font-size: 12px; color: #64748b; }
  #model-badge {
    margin-left: auto;
    background: #1d4ed8;
    color: #bfdbfe;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    display: none;
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; margin-left: auto; flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.ok { background: #22c55e; }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .sys-msg {
    text-align: center;
    font-size: 12px;
    color: #475569;
    padding: 8px 0;
  }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .avatar.user { background: #1d4ed8; color: white; }
  .avatar.ai   { background: #334155; color: #94a3b8; }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  .bubble.user { background: #1d4ed8; color: white; border-radius: 16px 4px 16px 16px; }
  .bubble.ai   { background: #1e293b; border: 1px solid #334155; border-radius: 4px 16px 16px 16px; }

  /* ── Ingredient cards ── */
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

  .card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tier {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tier-confirmed { background: #14532d; color: #86efac; }
  .tier-promising  { background: #713f12; color: #fcd34d; }
  .tier-preliminary { background: #1e3a5f; color: #93c5fd; }
  .tier-insufficient { background: #1e1e2e; color: #6b7280; }

  .card-info { flex: 1; min-width: 0; }
  .card-name  { font-size: 13px; font-weight: 600; color: #93c5fd; }
  .card-claim { font-size: 11px; color: #94a3b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-pmid  { font-size: 10px; color: #475569; flex-shrink: 0; }

  /* ── Typing indicator ── */
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #475569;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  /* ── Error bubble ── */
  .bubble.error { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }

  /* ── Input area ── */
  #input-area {
    padding: 14px 20px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #msg {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 10px 14px;
    color: #e2e8f0;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #msg:focus { border-color: #1d4ed8; }
  #msg:disabled { opacity: 0.4; }

  #send {
    background: #1d4ed8;
    border: none;
    border-radius: 10px;
    width: 44px; height: 44px;
    cursor: pointer;
    color: white;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #send:hover:not(:disabled) { background: #2563eb; }
  #send:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="logo">4EVR0</div>
  <div class="sub">화장품 성분 추천 AI</div>
  <div id="model-badge"></div>
  <div id="status-dot" title="연결 중..."></div>
</header>

<div id="chat">
  <div class="sys-msg" id="sys-init">세션을 시작하는 중...</div>
</div>

<div id="input-area">
  <textarea id="msg" placeholder="피부 고민을 입력하세요... (Enter로 전송, Shift+Enter로 줄바꿈)" rows="1" disabled></textarea>
  <button id="send" disabled>↑</button>
</div>

<script>
  const chat    = document.getElementById('chat');
  const msgEl   = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const dot     = document.getElementById('status-dot');
  const badge   = document.getElementById('model-badge');

  let sessionId = null;
  let sending   = false;

  // ── 세션 초기화 ──────────────────────────────────────────
  async function initSession() {
    try {
      const res  = await fetch('/api/v1/sessions', { method: 'POST' });
      const data = await res.json();
      sessionId  = data.session_id;

      dot.classList.add('ok');
      dot.title = '연결됨';
      document.getElementById('sys-init').textContent =
        '새 세션이 시작되었습니다. 피부 고민을 자유롭게 입력해보세요.';

      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    } catch (e) {
      document.getElementById('sys-init').textContent =
        '서버에 연결할 수 없습니다. 페이지를 새로고침해주세요.';
    }
  }

  // ── 버블 생성 헬퍼 ──────────────────────────────────────
  function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="avatar user">나</div>
      <div class="bubble user">${escHtml(text)}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function appendAIBubble(responseText, ingredients, modelUsed) {
    if (modelUsed) { badge.textContent = modelUsed; badge.style.display = ''; }

    const cardsHtml = ingredients && ingredients.length
      ? `<div class="cards">${ingredients.map(ing => `
          <div class="card">
            <span class="tier ${tierClass(ing.eligibility_tier)}">${ing.eligibility_tier}</span>
            <div class="card-info">
              <div class="card-name">${ing.kor_name?.trim()
                ? `${escHtml(ing.kor_name.trim())} (${escHtml(ing.name)})`
                : escHtml(ing.name)}</div>
              <div class="card-claim" title="${escHtml(ing.claim)}">${escHtml(ing.claim)}</div>
            </div>
            ${ing.paper_ref ? `<span class="card-pmid">${escHtml(ing.paper_ref)}</span>` : ''}
          </div>`).join('')}</div>`
      : '';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai">
        <div>${escHtml(responseText).replace(/\n/g, '<br>')}</div>
        ${cardsHtml}
      </div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble error">${escHtml(msg)}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  // ── 메시지 전송 ──────────────────────────────────────────
  async function send() {
    if (sending || !sessionId) return;
    const text = msgEl.value.trim();
    if (!text) return;

    sending = true;
    msgEl.value   = '';
    msgEl.style.height = '';
    msgEl.disabled  = true;
    sendBtn.disabled = true;

    appendUserBubble(text);
    appendTyping();

    try {
      const res  = await fetch('/api/v1/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendError(`오류 (${res.status}): ${err.detail || '알 수 없는 오류'}`);
      } else {
        const data = await res.json();
        appendAIBubble(data.response_text, data.ingredients, data.model_used);
      }
    } catch (e) {
      removeTyping();
      appendError('서버와 통신 중 오류가 발생했습니다.');
    } finally {
      sending = false;
      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    }
  }

  // ── 이벤트 바인딩 ────────────────────────────────────────
  sendBtn.addEventListener('click', send);

  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
  });

  // ── 유틸 ─────────────────────────────────────────────────
  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function tierClass(tier) {
    const map = {
      Confirmed: 'tier-confirmed',
      Promising: 'tier-promising',
      Preliminary: 'tier-preliminary',
      Insufficient: 'tier-insufficient',
    };
    return map[tier] || 'tier-insufficient';
  }

  // ── 시작 ─────────────────────────────────────────────────
  initSession();
</script>

</body>
</html>
