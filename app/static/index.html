<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4EVR0 · 화장품 성분 추천</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #eef6ee;
    --surface:   #ffffff;
    --surface-2: #f4faf3;
    --border:    #d6e8d4;
    --border-2:  #c4dcc0;
    --green:     #4caf72;
    --green-dk:  #2e7d4f;
    --green-lt:  #e3f3e6;
    --text:      #243528;
    --text-mut:  #6b8270;
    --text-fade: #9bb09f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--green-dk); letter-spacing: -0.5px; }
  .sub  { font-size: 12px; color: var(--text-mut); }
  #model-badge {
    margin-left: auto;
    background: var(--green-lt);
    color: var(--green-dk);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    display: none;
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #d97777; margin-left: auto; flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.ok { background: var(--green); }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .sys-msg {
    text-align: center;
    font-size: 12px;
    color: var(--text-fade);
    padding: 8px 0;
  }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .avatar.user { background: var(--green); color: white; }
  .avatar.ai   { background: var(--green-lt); color: var(--green-dk); }

  .bubble {
    max-width: 74%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(46, 125, 79, 0.06);
  }
  .bubble.user { background: var(--green); color: white; border-radius: 16px 4px 16px 16px; }
  .bubble.ai   { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }

  /* ── Markdown styling inside AI bubbles ── */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child  { margin-bottom: 0; }
  .md p       { margin: 8px 0; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 14px 0 6px;
    line-height: 1.35;
    color: var(--green-dk);
    font-weight: 700;
  }
  .md h1 { font-size: 17px; }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md strong { font-weight: 700; color: var(--green-dk); }
  .md em { font-style: italic; }
  .md a { color: var(--green-dk); text-decoration: underline; }
  .md code {
    background: var(--green-lt);
    color: var(--green-dk);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 12.5px;
    font-family: 'SFMono-Regular', Consolas, monospace;
  }
  .md pre {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .md pre code { background: none; padding: 0; color: var(--text); }
  .md blockquote {
    border-left: 3px solid var(--green);
    padding-left: 10px;
    margin: 8px 0;
    color: var(--text-mut);
  }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* ── Ingredient cards ── */
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tier {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tier-confirmed    { background: #d4f1de; color: #1f7a44; }
  .tier-promising    { background: #fcefcf; color: #9a7016; }
  .tier-preliminary  { background: #dceaf7; color: #2f6aa0; }
  .tier-insufficient { background: #e8ebe8; color: #7b8a7e; }

  .card-info { flex: 1; min-width: 0; }
  .card-name  { font-size: 13px; font-weight: 600; color: var(--green-dk); }
  .card-en    { font-size: 11px; font-weight: 400; color: var(--text-mut); margin-left: 4px; }
  .card-claim { font-size: 11px; color: var(--text-mut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-pmid  { font-size: 10px; color: var(--text-fade); flex-shrink: 0; }

  /* ── Typing indicator ── */
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    animation: pulse 1.2s ease-in-out infinite; opacity: 0.4;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.25;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  /* ── Error bubble ── */
  .bubble.error { background: #fdecec; border: 1px solid #f2c6c6; color: #b04545; }

  /* ── Input area ── */
  #input-area {
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #msg {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #msg::placeholder { color: var(--text-fade); }
  #msg:focus { border-color: var(--green); }
  #msg:disabled { opacity: 0.5; }

  #send {
    background: var(--green);
    border: none;
    border-radius: 10px;
    width: 44px; height: 44px;
    cursor: pointer;
    color: white;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #send:hover:not(:disabled) { background: var(--green-dk); }
  #send:disabled { opacity: 0.45; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="logo">4EVR0</div>
  <div class="sub">화장품 성분 추천 AI</div>
  <div id="model-badge"></div>
  <div id="status-dot" title="연결 중..."></div>
</header>

<div id="chat">
  <div class="sys-msg" id="sys-init">세션을 시작하는 중...</div>
</div>

<div id="input-area">
  <textarea id="msg" placeholder="피부 고민을 입력하세요... (Enter로 전송, Shift+Enter로 줄바꿈)" rows="1" disabled></textarea>
  <button id="send" disabled>↑</button>
</div>

<script>
  const chat    = document.getElementById('chat');
  const msgEl   = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const dot     = document.getElementById('status-dot');
  const badge   = document.getElementById('model-badge');

  let sessionId = null;
  let sending   = false;

  // ── 세션 초기화 ──────────────────────────────────────────
  async function initSession() {
    try {
      const res  = await fetch('/api/v1/sessions', { method: 'POST' });
      const data = await res.json();
      sessionId  = data.session_id;

      dot.classList.add('ok');
      dot.title = '연결됨';
      document.getElementById('sys-init').textContent =
        '새 세션이 시작되었습니다. 피부 고민을 자유롭게 입력해보세요.';

      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    } catch (e) {
      document.getElementById('sys-init').textContent =
        '서버에 연결할 수 없습니다. 페이지를 새로고침해주세요.';
    }
  }

  // ── 버블 생성 헬퍼 ──────────────────────────────────────
  function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="avatar user">나</div>
      <div class="bubble user">${escHtml(text).replace(/\n/g, '<br>')}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function appendAIBubble(responseText, ingredients, modelUsed) {
    if (modelUsed) { badge.textContent = modelUsed; badge.style.display = ''; }

    const cardsHtml = ingredients && ingredients.length
      ? `<div class="cards">${ingredients.map(ing => `
          <div class="card">
            <span class="tier ${tierClass(ing.eligibility_tier)}">${escHtml(ing.eligibility_tier)}</span>
            <div class="card-info">
              <div class="card-name">${ing.kor_name?.trim() && ing.kor_name.trim().toLowerCase() !== ing.name.toLowerCase()
                ? `${escHtml(ing.kor_name.trim())}<span class="card-en">(${escHtml(ing.name)})</span>`
                : escHtml(ing.name)}</div>
              <div class="card-claim" title="${escHtml(ing.claim)}">${escHtml(ing.claim)}</div>
            </div>
            ${ing.paper_ref ? `<span class="card-pmid">${escHtml(ing.paper_ref)}</span>` : ''}
          </div>`).join('')}</div>`
      : '';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble ai">
        <div class="md">${renderMarkdown(responseText || '')}</div>
        ${cardsHtml}
      </div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="bubble error">${escHtml(msg)}</div>`;
    chat.appendChild(row);
    scrollBottom();
  }

  // ── 메시지 전송 ──────────────────────────────────────────
  async function send() {
    if (sending || !sessionId) return;
    const text = msgEl.value.trim();
    if (!text) return;

    sending = true;
    msgEl.value   = '';
    msgEl.style.height = '';
    msgEl.disabled  = true;
    sendBtn.disabled = true;

    appendUserBubble(text);
    appendTyping();

    try {
      const res  = await fetch('/api/v1/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendError(`오류 (${res.status}): ${err.detail || '알 수 없는 오류'}`);
      } else {
        const data = await res.json();
        appendAIBubble(data.response_text, data.ingredients, data.model_used);
      }
    } catch (e) {
      removeTyping();
      appendError('서버와 통신 중 오류가 발생했습니다.');
    } finally {
      sending = false;
      msgEl.disabled  = false;
      sendBtn.disabled = false;
      msgEl.focus();
    }
  }

  // ── 이벤트 바인딩 ────────────────────────────────────────
  sendBtn.addEventListener('click', send);

  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
  });

  // ── 유틸 ─────────────────────────────────────────────────
  function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── 경량 마크다운 렌더러 (의존성 없음) ───────────────────
  // HTML을 먼저 이스케이프한 뒤 마크다운 문법을 적용하므로 XSS에 안전.
  function renderMarkdown(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    let html = '';
    let i = 0;

    // 인라인 요소 처리: 코드 → 볼드 → 이탤릭 → 링크
    function inline(text) {
      let t = escHtml(text);
      // 인라인 코드 (먼저 처리해서 내부 문법 보호)
      t = t.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      // 볼드
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      // 이탤릭
      t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      t = t.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
      // 링크 [text](url)
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return t;
    }

    while (i < lines.length) {
      let line = lines[i];

      // 빈 줄 → 스킵
      if (/^\s*$/.test(line)) { i++; continue; }

      // 코드 블록 ```
      if (/^\s*```/.test(line)) {
        i++;
        let code = '';
        while (i < lines.length && !/^\s*```/.test(lines[i])) {
          code += lines[i] + '\n';
          i++;
        }
        i++; // 닫는 ``` 스킵
        html += `<pre><code>${escHtml(code.replace(/\n$/, ''))}</code></pre>`;
        continue;
      }

      // 헤더 #
      let h = line.match(/^\s*(#{1,4})\s+(.*)$/);
      if (h) {
        const level = h[1].length;
        html += `<h${level}>${inline(h[2])}</h${level}>`;
        i++;
        continue;
      }

      // 수평선
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        html += '<hr>';
        i++;
        continue;
      }

      // 인용 >
      if (/^\s*>\s?/.test(line)) {
        let quote = '';
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quote += lines[i].replace(/^\s*>\s?/, '') + '\n';
          i++;
        }
        html += `<blockquote>${inline(quote.trim()).replace(/\n/g, '<br>')}</blockquote>`;
        continue;
      }

      // 순서 없는 리스트
      if (/^\s*[-*+]\s+/.test(line)) {
        html += '<ul>';
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          html += `<li>${inline(lines[i].replace(/^\s*[-*+]\s+/, ''))}</li>`;
          i++;
        }
        html += '</ul>';
        continue;
      }

      // 순서 있는 리스트
      if (/^\s*\d+\.\s+/.test(line)) {
        html += '<ol>';
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          html += `<li>${inline(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`;
          i++;
        }
        html += '</ol>';
        continue;
      }

      // 일반 문단 (연속된 비어있지 않은 줄을 묶음)
      let para = '';
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^\s*(#{1,4}\s|[-*+]\s|\d+\.\s|>|```|(-{3,}|\*{3,}|_{3,})\s*$)/.test(lines[i])) {
        para += (para ? '\n' : '') + lines[i];
        i++;
      }
      html += `<p>${inline(para).replace(/\n/g, '<br>')}</p>`;
    }

    return html;
  }

  function tierClass(tier) {
    const map = {
      Confirmed: 'tier-confirmed',
      Promising: 'tier-promising',
      Preliminary: 'tier-preliminary',
      Insufficient: 'tier-insufficient',
    };
    return map[tier] || 'tier-insufficient';
  }

  // ── 시작 ─────────────────────────────────────────────────
  initSession();
</script>

</body>
</html>
